<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Rent a Pet - Graphics</title>
	<link rel="stylesheet" href="./stylesheets/color_palette.css"> <!-- Only for the root vars for the color palette -->

	<style type="text/css">
		body {
			background-color: var(--eggshell);
		}

		#thumbs,
		#image {
			width: 900px;
			text-align: center;
			margin: 0 auto 0 auto;
			color: #000;
		}

		#thumbs {
			margin-top: 10px;
		}


		#thumbs img {
			border: solid 1px #000;
			margin: 5px;
		}

		#image {
			height: 500px;
		}
		#logo
		{
			background-color: var(--med-green);
		}

		.instructions {
			font-style: italic;
		}
	</style>

	<script language="JavaScript" type="text/javascript">

		PrintButton1 = new Image
		PrintButton2 = new Image
		logo1 = new Image
		logo2 = new Image
		if (document.images) {
			PrintButton1.src = "images/print5.gif"
			PrintButton2.src = "images/print6.gif"
			logo1.src = "images/logo1.jpg"
			logo2.src = "images/logo2.jpg"
		}


		var imgArray = new Array(
			'Image1Lg.jpg',
			'Image2Lg.jpg',
			'Image3Lg.jpg',
			'Image4Lg.jpg'
		);


		var titleArray = new Array(
			'Man holding his Snake',
			'Bird and a Dog',
			'Woman and her Dog',
			'Pig'
		);

		var imgPath = "images/fullsize/";

		function swapImage(imgID) {

			var theImage = document.getElementById('theImage');
			var textDiv = document.getElementById('bottomText');

			var newImg;
			var textTitle;

			newImg = imgArray[imgID];
			theImage.src = imgPath + newImg;

			textTitle = titleArray[imgID];

			textDiv.innerHTML = textTitle;
		}

		function preloadImages() {
			for (var i = 0; i < imgArray.length; i++) {
				var tmpImg = new Image;
				tmpImg.src = imgPath + imgArray[i];
			}
		}


	</script>


</head>

<body onload="preloadImages()">

	<div align="center">

		<div>
			<a href="" onmouseover="document.getElementById('print').src='images/print2.gif';"
				onmouseout="document.getElementById('print').src='images/print1.jpg';">
				<img src="images/print1.jpg" alt="Print Page" width="200" height="50" id="print"></a>
		</div>



		<div>
			<a href="" onmouseover="document.getElementById('logo').src='images/Logo2.png';"
				onmouseout="document.getElementById('logo').src='images/Logo1.png';">
				<img src="images/Logo1.png" alt="Logo" id="logo"></a>
		</div>


		<br />
		<br />
		<br />
		<br />


		<div id="thumbs">
			<img src="images/thumbnails/Image1Sm.jpg" alt="Dog doing Trick" onmouseover="swapImage(0);" />
			<img src="images/thumbnails/Image2Sm.jpg" alt="Two hunting Dogs" onmouseover="swapImage(1);" />
			<img src="images/thumbnails/Image3Sm.jpg" alt="Dog and two kids" onmouseover="swapImage(2);" />
			<img src="images/thumbnails/Image4Sm.jpg" alt="Woman and Dog" onmouseover="swapImage(3);" />

		</div>

		<div id="image">

			<img id="theImage" src="images/fullsize/Image1Lg.jpg" alt="Dog doing trick" />
			<h3 id="bottomText">Man holding his Snake</h3>
		</div>

		<img src="images/2colback.jpg">

		<br />
		<br />
		<br />
		<br />



	</div>

	<p>
		<a href="http://validator.w3.org/check?uri=referer"><img src="http://www.w3.org/Icons/valid-xhtml10"
				alt="Valid XHTML 1.0 Transitional" height="31" width="88" /></a>
	</p>


</body>

</html>
