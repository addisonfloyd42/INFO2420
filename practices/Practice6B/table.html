   <!DOCTYPE html>
   <html lang="en">


   <head>

      <meta charset="UTF-8">

      <title>HTML Practice 6 - Tables</title>

      <style>
         caption
         {
            color: #003300;
            font-size: 20px;
         }

         table
         {
            border: solid 1px black;
            padding: 5px;
            text-align: center;
            border-collapse: separate;
            border-spacing: 5px;
         }

         #days
         {
            background-color: #9F6;
            font-weight: bold;
         }

         #courses
         {
            background-color: #CCCCCC;
            width: 25%;
         }

         td
         {
            background-color: white;
         }

         th, 
         td
         {
            padding: 4px 8px;
            border: solid 1px black;
            margin: 7px;
         }
         
      </style>
   </head>

   <body>
      <div>
         <table>
            <caption>My Class Schedule</caption>
            <colgroup>
               <col id="courses">
               <col id="days" span="5">
            </colgroup>
            <colgroup>
               <tr>
                  <th>Courses</th>
                  <th>Monday</th>
                  <th>Tuesday</th>
                  <th>Wednesday</th>
                  <th>Thursday</th>
                  <th>Friday</th>
               </tr>
               <tr>
                  <th>INFO 1120</th>
                  <td></td>
                  <td>9-11</td>
                  <td></td>
                  <td>9-11</td>
                  <td rowspan="2"></td>
               </tr>
               <tr>
                  <th>MATH 1010</th>
                  <td colspan="4">12-1</td>
               </tr>
               <tr>
                  <th>INFO 2420</th>
                  <td colspan="5">Online Available 24/7</td>
               </tr>
            </colgroup>
         </table>
      </div>



   </body>

   </html>
